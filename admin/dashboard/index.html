<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#080611"
>

<title>PYNI Admin — Login</title>

<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* ================================
   BODY
================================ */

html{
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:#080611;

    overflow:hidden;
}


/* ================================
   BACKGROUND
================================ */

.background{
    position:fixed;

    inset:0;

    z-index:-10;

    background:
        linear-gradient(
            135deg,
            rgba(5,4,12,.82),
            rgba(12,7,25,.88)
        ),
        url("../assets/background.jpg")
        center/cover no-repeat;
}


.background::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(124,58,237,.30),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(236,72,153,.22),
            transparent 32%
        );
}


.background::after{
    content:"";

    position:absolute;

    width:500px;
    height:500px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(124,58,237,.12);

    filter:blur(100px);

    border-radius:50%;
}


/* ================================
   CENTER
================================ */

.page{
    width:100%;
    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;
}


/* ================================
   LOGIN CARD
================================ */

.login-card{
    width:min(
        430px,
        100%
    );

    padding:34px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(20,17,34,.88),
            rgba(8,7,15,.92)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55),
        0 0 80px
        rgba(124,58,237,.12);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    position:relative;

    overflow:hidden;
}


.login-card::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-100px;
    top:-100px;

    border-radius:50%;

    background:
        rgba(139,92,246,.20);

    filter:blur(25px);
}


.login-card::after{
    content:"";

    position:absolute;

    width:140px;
    height:140px;

    left:-80px;
    bottom:-80px;

    border-radius:50%;

    background:
        rgba(236,72,153,.13);

    filter:blur(25px);
}


/* ================================
   LOGO
================================ */

.logo-area{
    text-align:center;

    position:relative;

    z-index:2;

    margin-bottom:27px;
}


.logo{
    width:82px;
    height:82px;

    object-fit:cover;

    border-radius:23px;

    border:
        1px solid
        rgba(255,255,255,.20);

    box-shadow:
        0 0 35px
        rgba(139,92,246,.45);

    margin-bottom:17px;
}


.logo-area h1{
    font-size:27px;

    letter-spacing:3px;

    font-weight:900;

    text-shadow:
        0 0 20px
        rgba(139,92,246,.45);
}


.logo-area h1 span{
    color:#a78bfa;
}


.logo-area p{
    margin-top:8px;

    color:#858da1;

    font-size:12px;

    letter-spacing:.5px;
}


/* ================================
   ADMIN BADGE
================================ */

.admin-badge{
    display:inline-flex;

    align-items:center;

    gap:7px;

    margin-top:15px;

    padding:7px 12px;

    border-radius:999px;

    background:
        rgba(139,92,246,.10);

    border:
        1px solid
        rgba(139,92,246,.25);

    color:#c4b5fd;

    font-size:10px;

    font-weight:bold;

    letter-spacing:1px;
}


.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
        0 0 12px
        #22c55e;
}


/* ================================
   FORM
================================ */

.login-form{
    position:relative;

    z-index:2;
}


.form-group{
    margin-bottom:17px;
}


.form-group label{
    display:block;

    margin-bottom:8px;

    color:#cbd5e1;

    font-size:12px;

    font-weight:bold;
}


.input-wrapper{
    position:relative;
}


.input-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    font-size:16px;

    opacity:.75;

    pointer-events:none;
}


.form-input{
    width:100%;

    height:52px;

    padding:
        0 15px
        0 45px;

    color:white;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:13px;

    outline:none;

    font-size:14px;

    transition:.25s;
}


.form-input::placeholder{
    color:#656d80;
}


.form-input:focus{
    border-color:
        rgba(139,92,246,.65);

    background:
        rgba(139,92,246,.07);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.10),
        0 0 25px
        rgba(139,92,246,.10);
}


/* ================================
   PASSWORD TOGGLE
================================ */

.password-toggle{
    position:absolute;

    right:13px;
    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:transparent;

    color:#858da1;

    cursor:pointer;

    font-size:16px;

    padding:5px;
}


.password-toggle:hover{
    color:white;
}


/* ================================
   REMEMBER
================================ */

.form-options{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:
        5px 0 20px;
}


.remember{
    display:flex;

    align-items:center;

    gap:8px;

    color:#858da1;

    font-size:11px;

    cursor:pointer;
}


.remember input{
    accent-color:#8b5cf6;
}


/* ================================
   LOGIN BUTTON
================================ */

.login-button{
    width:100%;

    height:53px;

    border:0;

    border-radius:14px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #ec4899
        );

    font-size:14px;

    font-weight:900;

    letter-spacing:.5px;

    cursor:pointer;

    box-shadow:
        0 12px 35px
        rgba(124,58,237,.30);

    transition:.25s;

    position:relative;

    overflow:hidden;
}


.login-button::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.20),
            transparent
        );

    transition:.5s;
}


.login-button:hover::before{
    left:100%;
}


.login-button:hover{
    transform:
        translateY(-2px);

    box-shadow:
        0 17px 45px
        rgba(124,58,237,.40);
}


.login-button:active{
    transform:
        translateY(0);
}


/* ================================
   ERROR
================================ */

.error-message{
    display:none;

    margin-bottom:16px;

    padding:12px 14px;

    border-radius:11px;

    background:
        rgba(239,68,68,.09);

    border:
        1px solid
        rgba(239,68,68,.25);

    color:#fca5a5;

    font-size:12px;

    line-height:1.5;

    text-align:center;
}


.error-message.show{
    display:block;

    animation:
        shake .3s ease;
}


@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-5px);
    }

    75%{
        transform:translateX(5px);
    }

}


/* ================================
   LOADING
================================ */

.loading{
    display:none;

    align-items:center;

    justify-content:center;

    gap:10px;
}


.loading.show{
    display:flex;
}


.spinner{
    width:17px;
    height:17px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.30);

    border-top-color:white;

    animation:
        spin .7s linear infinite;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* ================================
   FOOTER
================================ */

.login-footer{
    position:relative;

    z-index:2;

    margin-top:25px;

    padding-top:20px;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    text-align:center;

    color:#555d70;

    font-size:10px;

    line-height:1.7;
}


.login-footer strong{
    color:#a78bfa;
}


/* ================================
   SECURITY NOTICE
================================ */

.security-notice{
    margin-top:17px;

    padding:11px 13px;

    border-radius:11px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.06);

    color:#697185;

    font-size:10px;

    line-height:1.6;

    text-align:center;
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px){

    .page{
        padding:18px;
    }

    .login-card{
        padding:27px 21px;

        border-radius:23px;
    }

    .logo{
        width:72px;
        height:72px;

        border-radius:20px;
    }

    .logo-area h1{
        font-size:24px;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="background"></div>


<!-- PAGE -->

<main class="page">


    <!-- LOGIN CARD -->

    <section class="login-card">


        <!-- LOGO -->

        <div class="logo-area">

            <img
                class="logo"
                src="../assets/pyni.jpg"
                alt="PYNI"
                onerror="
                    this.style.display='none';
                "
            >

            <h1>
                PYNI<span>.</span> ADMIN
            </h1>

            <p>
                Control Center
            </p>

            <div class="admin-badge">

                <span class="status-dot"></span>

                PRIVATE ADMIN AREA

            </div>

        </div>


        <!-- FORM -->

        <form
            id="loginForm"
            class="login-form"
            autocomplete="off"
        >


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    USERNAME
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        id="username"
                        class="form-input"
                        type="text"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    PASSWORD
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        id="password"
                        class="form-input"
                        type="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Tampilkan password"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Ingat perangkat ini

                </label>

            </div>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="error-message"
            >
                Username atau password salah.
            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >

                <span id="buttonText">
                    🔐 LOGIN ADMIN
                </span>

                <span
                    id="loading"
                    class="loading"
                >

                    <span class="spinner"></span>

                    Memverifikasi...

                </span>

            </button>


        </form>


        <!-- SECURITY -->

        <div class="security-notice">

            🔒 Area ini khusus administrator Pyni.
            Jangan membagikan kredensial admin
            kepada orang lain.

        </div>


        <!-- FOOTER -->

        <div class="login-footer">

            <strong>PYNI ADMIN</strong>

            <br>

            Preset Management • AI • Leaderboard

            <br>

            © 2026 Pyni

        </div>


    </section>


</main>


<script>

/* =========================================
   PYNI ADMIN LOGIN
========================================= */


/*
    LOGIN DATA

    Username:
    admin

    Password:
    pyni2557
*/

const ADMIN_USERNAME = "admin";

const ADMIN_PASSWORD = "pyni2557";


/*
    DASHBOARD URL

    Setelah login berhasil,
    browser akan menuju:

    /Pyni/admin/dashboard/
*/

const DASHBOARD_URL =
    "/Pyni/admin/dashboard/";


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const passwordToggle =
    document.getElementById(
        "passwordToggle"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const buttonText =
    document.getElementById(
        "buttonText"
    );


const loading =
    document.getElementById(
        "loading"
    );


const rememberInput =
    document.getElementById(
        "remember"
    );


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

passwordToggle.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            passwordToggle.textContent =
                "🙈";

            passwordToggle.setAttribute(
                "aria-label",
                "Sembunyikan password"
            );

        }else{

            passwordInput.type =
                "password";

            passwordToggle.textContent =
                "👁️";

            passwordToggle.setAttribute(
                "aria-label",
                "Tampilkan password"
            );

        }

    }
);


/* =========================================
   ERROR
========================================= */

function showError(
    message
){

    errorMessage.textContent =
        message;

    errorMessage.classList.add(
        "show"
    );

}


function hideError(){

    errorMessage.classList.remove(
        "show"
    );

}


/* =========================================
   LOADING
========================================= */

function setLoading(
    state
){

    if(state){

        loginButton.disabled =
            true;

        buttonText.style.display =
            "none";

        loading.classList.add(
            "show"
        );

    }else{

        loginButton.disabled =
            false;

        buttonText.style.display =
            "inline";

        loading.classList.remove(
            "show"
        );

    }

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        hideError();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        /* VALIDASI KOSONG */

        if(!username){

            showError(
                "Username belum diisi."
            );

            usernameInput.focus();

            return;

        }


        if(!password){

            showError(
                "Password belum diisi."
            );

            passwordInput.focus();

            return;

        }


        /* CEK LOGIN */

        if(
            username ===
            ADMIN_USERNAME
            &&
            password ===
            ADMIN_PASSWORD
        ){

            setLoading(true);


            /*
                Simpan status login
                selama tab/browser
                masih menggunakan
                session ini.
            */

            sessionStorage.setItem(
                "pyniAdminLoggedIn",
                "true"
            );


            sessionStorage.setItem(
                "pyniAdminUsername",
                username
            );


            /*
                Jika user mencentang
                "Ingat perangkat ini",
                simpan status login
                di localStorage.
            */

            if(
                rememberInput.checked
            ){

                localStorage.setItem(
                    "pyniAdminRemember",
                    "true"
                );

            }else{

                localStorage.removeItem(
                    "pyniAdminRemember"
                );

            }


            /*
                Beri sedikit waktu
                agar animasi login
                terlihat.
            */

            setTimeout(
                function(){

                    window.location.href =
                        DASHBOARD_URL;

                },
                700
            );


        }else{

            showError(
                "Username atau password salah."
            );

            passwordInput.value = "";

            passwordInput.focus();

        }

    }
);


/* =========================================
   ENTER USERNAME → PASSWORD
========================================= */

usernameInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            passwordInput.focus();

        }

    }
);


/* =========================================
   JIKA SUDAH LOGIN
========================================= */

function checkExistingLogin(){

    const loggedIn =
        sessionStorage.getItem(
            "pyniAdminLoggedIn"
        );


    const remembered =
        localStorage.getItem(
            "pyniAdminRemember"
        );


    /*
        Jika sudah login,
        langsung arahkan
        ke dashboard.
    */

    if(
        loggedIn === "true"
        ||
        remembered === "true"
    ){

        window.location.replace(
            DASHBOARD_URL
        );

    }

}


/* =========================================
   START
========================================= */

checkExistingLogin();

</script>

</body>
</html>
