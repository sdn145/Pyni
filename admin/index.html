<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PYNI Admin Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}


body{

    min-height:100vh;

    background:#080611;

    color:white;

}



/* SIDEBAR */

.sidebar{

    position:fixed;

    left:0;

    top:0;

    bottom:0;

    width:240px;

    padding:25px;

    background:#11101a;

    border-right:
    1px solid rgba(255,255,255,.08);

}



.logo{

    font-size:32px;

    font-weight:900;

    letter-spacing:2px;

}



.logo span{

    color:#a855f7;

}



.sidebar p{

    color:#888;

    margin-top:5px;

}



.menu{

    margin-top:30px;

}



.menu button{

    width:100%;

    padding:14px;

    margin-bottom:12px;

    border:0;

    border-radius:14px;

    background:#211d30;

    color:white;

    cursor:pointer;

    text-align:left;

    font-weight:bold;

    transition:.25s;

}



.menu button:hover,
.menu button.active{

    background:

    linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
    );

}





/* MAIN */


main{

    margin-left:240px;

    padding:30px;

}



.page{

    display:none;

}



.page.active{

    display:block;

}





/* CARD */


.card{

    background:#171421;

    border:

    1px solid rgba(255,255,255,.08);

    border-radius:22px;

    padding:25px;

    margin-bottom:25px;

}





h1{

    font-size:30px;

    margin-bottom:20px;

}





/* DASHBOARD */


.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:15px;

}



.stat{

    background:#211d30;

    padding:22px;

    border-radius:18px;

}



.stat h2{

    font-size:36px;

    color:#c4b5fd;

}



.stat p{

    color:#999;

    margin-top:8px;

}






/* FORM */


input,
textarea{


    width:100%;

    padding:14px;

    margin-top:12px;

    background:#090812;

    color:white;

    border:

    1px solid #333;

    border-radius:12px;

    outline:none;

}



textarea{

    height:120px;

    resize:none;

}



input:focus,
textarea:focus{

    border-color:#a855f7;

}






button.publish{

    width:100%;

    margin-top:20px;

    padding:15px;

    border:0;

    border-radius:13px;


    background:

    linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
    );


    color:white;

    font-weight:bold;

    cursor:pointer;

}





.preview{

    width:250px;

    height:160px;

    object-fit:cover;

    border-radius:15px;

    margin-top:15px;

    display:none;

}






/* TABLE */


table{

    width:100%;

    border-collapse:collapse;

}



th,
td{

    padding:14px;

    border-bottom:

    1px solid rgba(255,255,255,.1);

    text-align:left;

}



td img{

    width:70px;

    height:50px;

    object-fit:cover;

    border-radius:8px;

}





.status{

    margin-top:15px;

    padding:13px;

    border-radius:12px;

    background:#13271a;

    color:#86efac;

}







@media(max-width:800px){


.sidebar{

    position:relative;

    width:100%;

}



main{

    margin-left:0;

}



.stats{

    grid-template-columns:1fr;

}



}

</style>
</head>

<body>


<aside class="sidebar">


<div class="logo">
PYNI<span>.</span>
</div>


<p>
Admin Studio
</p>



<div class="menu">


<button
class="active"
onclick="openPage('dashboard',this)">
📊 Dashboard
</button>



<button
onclick="openPage('upload',this)">
➕ Upload Preset
</button>



<button
onclick="openPage('setting',this)">
⚙️ Setting Preset
</button>



</div>


</aside>





<main>





<section
id="dashboard"
class="page active">


<div class="card">


<h1>
Dashboard
</h1>



<div class="stats">



<div class="stat">

<h2 id="total">
0
</h2>

<p>
Total Preset
</p>

</div>





<div class="stat">

<h2>
ONLINE
</h2>

<p>
Worker Status
</p>

</div>





<div class="stat">

<h2>
1080P
</h2>

<p>
Quality
</p>

</div>



</div>


</div>


</section>







<section
id="upload"
class="page">



<div class="card">


<h1>
Upload Preset
</h1>




<input
id="name"
placeholder="Nama Preset">





<textarea
id="desc"
placeholder="Deskripsi preset">
</textarea>





<input
id="link"
placeholder="Link Preset">





<input
id="image"
placeholder="nama.jpg">





<p style="
color:#888;
font-size:13px;
margin-top:10px;
">

Foto:

<br>

Pyni/assets/preset/nama.jpg

</p>





<img
id="preview"
class="preview">





<button
class="publish"
onclick="publishPreset()">

🚀 PUBLISH PRESET

</button>





<div
id="status"
class="status">

</div>



</div>


</section>








<section
id="setting"
class="page">


<div class="card">



<h1>
Setting Preset
</h1>





<table>



<thead>


<tr>

<th>
Foto
</th>


<th>
Nama
</th>


<th>
Kategori
</th>


<th>
Deskripsi
</th>


<th>
Link
</th>


<th>
Aksi
</th>


</tr>


</thead>




<tbody
id="table">


</tbody>





</table>



</div>


</section>





</main>
<script>


const WORKER_URL =
"https://pyni-preset-api.mandasukaaku.workers.dev/";



let presets=[];




function openPage(id,btn){


document
.querySelectorAll(".page")
.forEach(
page=>{
page.classList.remove("active");
}
);



document
.getElementById(id)
.classList.add("active");



document
.querySelectorAll(".menu button")
.forEach(
button=>{
button.classList.remove("active");
}
);



btn.classList.add("active");



if(id==="setting"){

loadPresets();

}


}







image.oninput=function(){


preview.src =
"../assets/preset/"+this.value;



preview.style.display="block";



preview.onerror=function(){

preview.style.display="none";

};


}









async function loadPresets(){


try{


let res =
await fetch(
WORKER_URL
);



let data =
await res.json();




if(data.presets){


presets =
data.presets;


}



updateDashboard();


renderTable();



}

catch(err){


console.log(err);


}

}








function updateDashboard(){


document
.getElementById("total")
.innerHTML =
presets.length;


}









function renderTable(){


let table =
document.getElementById("table");



table.innerHTML="";





if(presets.length===0){


table.innerHTML=`

<tr>

<td colspan="6">

Belum ada preset

</td>

</tr>

`;

return;


}







presets.forEach(
(item,index)=>{


table.innerHTML += `


<tr>


<td>

<img src="../${item.image.replace("./","")}"

style="
width:70px;
height:50px;
object-fit:cover;
border-radius:8px;
">

</td>




<td>
${item.name}
</td>




<td>
${item.category || "JJ"}
</td>




<td>
${item.description}
</td>




<td>

<a href="${item.download}" target="_blank">

Buka

</a>

</td>




<td>


<button

onclick="deletePreset('${item.id}')"

style="
background:#ef4444;
color:white;
border:0;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
">

Hapus

</button>


</td>



</tr>


`;


}

);


}









async function publishPreset(){



let data={


name:
document.getElementById("name").value.trim(),



description:
document.getElementById("desc").value.trim(),



download:
document.getElementById("link").value.trim(),



image:
"./assets/preset/"+document.getElementById("image").value.trim(),



category:
"JJ"



};






if(
!data.name ||
!data.download ||
!data.image
){


status.innerHTML=
"❌ Data belum lengkap";


return;


}





status.innerHTML=
"⏳ Mengirim ke Worker...";








try{


let res =
await fetch(
WORKER_URL,
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:
JSON.stringify(data)


}

);





let result =
await res.json();







if(result.ok){



status.innerHTML=
"✅ Preset berhasil dipublish";



document.getElementById("name").value="";
document.getElementById("desc").value="";
document.getElementById("link").value="";
document.getElementById("image").value="";

preview.style.display="none";



loadPresets();



}

else{


status.innerHTML=
"❌ "+result.error;


}



}

catch(error){


status.innerHTML=
"❌ "+error.message;


}




}










async function deletePreset(id){



if(
!confirm("Hapus preset ini?")
){

return;

}




try{



let res =
await fetch(
WORKER_URL,
{

method:"DELETE",

headers:{

"Content-Type":
"application/json"

},


body:
JSON.stringify({

id:id

})


}

);




let result =
await res.json();




if(result.ok){


loadPresets();


}



else{


alert(result.error);


}



}


catch(err){


alert(err.message);


}



}








loadPresets();



</script>


</body>

</html>
