<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PYNI Admin Studio</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

margin:0;

min-height:100vh;

background:#080611;

color:white;

}




.sidebar{

position:fixed;

left:0;

top:0;

bottom:0;

width:240px;

padding:25px;

background:#11101a;

border-right:

1px solid rgba(255,255,255,.08);

}




.logo{

font-size:32px;

font-weight:900;

letter-spacing:2px;

}



.logo span{

color:#a855f7;

}



.sidebar p{

color:#888;

margin-top:5px;

}




.menu{

margin-top:30px;

}




.menu button{

width:100%;

padding:14px;

margin-bottom:12px;

border:0;

border-radius:14px;

background:#211d30;

color:white;

cursor:pointer;

text-align:left;

font-weight:bold;

transition:.25s;

}




.menu button:hover,
.menu button.active{

background:

linear-gradient(

135deg,

#7c3aed,

#ec4899

);

}






main{

margin-left:240px;

padding:30px;

}




.page{

display:none;

}




.page.active{

display:block;

}




.card{

background:#171421;

border:

1px solid rgba(255,255,255,.08);

border-radius:22px;

padding:25px;

margin-bottom:25px;

}




h1{

font-size:30px;

margin-bottom:20px;

}




.stats{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:15px;

}




.stat{

background:#211d30;

padding:22px;

border-radius:18px;

}




.stat h2{

font-size:36px;

color:#c4b5fd;

}




.stat p{

color:#999;

margin-top:8px;

}
input,
textarea,
select{

width:100%;

padding:14px;

margin-top:12px;

background:#090812;

color:white;

border:

1px solid #333;

border-radius:12px;

outline:none;

}



textarea{

height:120px;

resize:none;

}



select{

cursor:pointer;

}



input:focus,
textarea:focus,
select:focus{

border-color:#a855f7;

}





button.publish{

width:100%;

margin-top:20px;

padding:15px;

border:0;

border-radius:13px;

background:

linear-gradient(

135deg,

#7c3aed,

#ec4899

);


color:white;

font-weight:bold;

cursor:pointer;

}





.preview{

width:250px;

height:160px;

object-fit:cover;

border-radius:15px;

margin-top:15px;

display:none;

}





table{

width:100%;

border-collapse:collapse;

}




th,
td{

padding:14px;

border-bottom:

1px solid rgba(255,255,255,.1);

text-align:left;

}





td img{

width:70px;

height:50px;

object-fit:cover;

border-radius:8px;

}




.status{

margin-top:15px;

padding:13px;

border-radius:12px;

background:#13271a;

color:#86efac;

}





@media(max-width:800px){


.sidebar{

position:relative;

width:100%;

}



main{

margin-left:0;

}



.stats{

grid-template-columns:1fr;

}


}


</style>

</head>


<body>


<aside class="sidebar">


<div class="logo">

PYNI<span>.</span>

</div>


<p>
Admin Studio
</p>





<div class="menu">


<button
class="active"
onclick="openPage('dashboard',this)">

📊 Dashboard

</button>



<button
onclick="openPage('upload',this)">

➕ Upload Preset

</button>




<button
onclick="openPage('setting',this)">

⚙️ Setting Preset

</button>



</div>


</aside>







<main>





<section
id="dashboard"
class="page active">


<div class="card">


<h1>

Dashboard

</h1>



<div class="stats">



<div class="stat">

<h2 id="total">

0

</h2>


<p>

Total Preset

</p>


</div>





<div class="stat">

<h2>

ONLINE

</h2>


<p>

Worker Status

</p>


</div>





<div class="stat">

<h2>

KV

</h2>


<p>

Cloudflare Storage

</p>


</div>



</div>


</div>


</section>









<section
id="upload"
class="page">


<div class="card">


<h1>

Upload Preset

</h1>





<input
id="name"
type="text"
placeholder="Nama Preset">





<textarea
id="desc"
placeholder="Deskripsi preset">
</textarea>





<input
id="link"
type="text"
placeholder="Link Preset (wajib)">





<input
id="image"
type="text"
placeholder="Nama foto.jpg">





<select id="category">


<option value="JJ">

JJ

</option>


<option value="Shake">

Shake

</option>


<option value="Velocity">

Velocity

</option>


<option value="Beat">

Beat

</option>


<option value="Slowmo">

Slowmo

</option>



</select>



<p style="
color:#888;
font-size:13px;
margin-top:10px;
">

Foto:

<br>

Pyni/assets/preset/nama.jpg

</p>




<img
id="preview"
class="preview">





<button

class="publish"

onclick="publishPreset()">

🚀 PUBLISH PRESET

</button>





<div
id="status"
class="status">

</div>



</div>


</section>
<script>


const WORKER_URL =
"https://pyni-preset-api.mandasukaaku.workers.dev/";



const nameInput =
document.getElementById("name");


const descInput =
document.getElementById("desc");


const linkInput =
document.getElementById("link");


const imageInput =
document.getElementById("image");


const categoryInput =
document.getElementById("category");


const preview =
document.getElementById("preview");


const statusBox =
document.getElementById("status");


const table =
document.getElementById("table");


const total =
document.getElementById("total");



let presets = [];







function openPage(id,btn){


document

.querySelectorAll(".page")

.forEach(page=>{

page.classList.remove("active");

});




document

.getElementById(id)

.classList.add("active");





document

.querySelectorAll(".menu button")

.forEach(button=>{

button.classList.remove("active");

});




btn.classList.add("active");





if(id==="setting"){

loadPresets();

}


}









imageInput.addEventListener(
"input",
()=>{


let img =
imageInput.value.trim();




if(img===""){

preview.style.display="none";

return;

}




preview.src =

"../assets/preset/"+img;



preview.style.display="block";



preview.onerror=()=>{

preview.style.display="none";

};



});










async function loadPresets(){


try{


let response =
await fetch(

WORKER_URL+"?time="+Date.now(),

{

cache:"no-store"

}

);





let data =
await response.json();





presets =

Array.isArray(data.presets)

?

data.presets

:

[];






total.innerText =

presets.length;




renderTable();



}


catch(error){


console.log(error);


}

}









function renderTable(){


table.innerHTML="";




if(presets.length===0){


table.innerHTML=`

<tr>

<td colspan="6">

Belum ada preset

</td>

</tr>

`;

return;

}






presets.forEach(item=>{



table.innerHTML += `


<tr>



<td>

<img src="../${

(item.image || "")

.replace("./","")

}">

</td>




<td>

${item.name || "-"}

</td>




<td>

${item.category || "JJ"}

</td>




<td>

${item.description || "-"}

</td>




<td>

<a href="${item.download || "#"}" target="_blank">

Buka

</a>

</td>




<td>


<button

onclick="deletePreset('${item.id}')"

style="

background:#ef4444;

color:white;

border:0;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

">

Hapus

</button>


</td>



</tr>



`;



});


}
async function publishPreset(){



let name =
nameInput.value.trim();



let desc =
descInput.value.trim();



let link =
linkInput.value.trim();



let image =
imageInput.value.trim();



let category =
categoryInput.value;




if(link===""){


statusBox.innerHTML =

"❌ Link preset wajib diisi";


return;

}






let data = {


name:

name || "Preset Tanpa Nama",



description:

desc || "",



download:

link,



image:

image
?
"./assets/preset/"+image
:
"",



category:

category || "JJ",



active:true


};






statusBox.innerHTML =

"⏳ Upload ke KV...";





try{



let response =

await fetch(

WORKER_URL,

{

method:"POST",

headers:{

"Content-Type":

"application/json"

},

body:

JSON.stringify(data)

}

);





let result =

await response.json();





if(result.ok){



statusBox.innerHTML =

"✅ Preset berhasil dipublish";





nameInput.value="";

descInput.value="";

linkInput.value="";

imageInput.value="";

preview.style.display="none";





await loadPresets();



}

else{


statusBox.innerHTML =

"❌ "+(result.error || "Gagal");


}





}

catch(error){



statusBox.innerHTML =

"❌ "+error.message;



}



}









async function deletePreset(id){



if(!confirm(

"Hapus preset ini?"

)){

return;

}





try{



let response =

await fetch(

WORKER_URL,

{

method:"DELETE",

headers:{

"Content-Type":

"application/json"

},

body:

JSON.stringify({

id:id

})

}

);





let result =

await response.json();






if(result.ok){



presets =

presets.filter(

item=>item.id !== id

);




total.innerText =

presets.length;




renderTable();



}

else{


alert(result.error);

}



}

catch(error){


alert(error.message);


}



}







loadPresets();



</script>



</body>

</html>
