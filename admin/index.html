<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
PYNI Admin Studio
</title>


<style>


*{

box-sizing:border-box;

font-family:
Arial,
Helvetica,
sans-serif;

}



body{

margin:0;

background:#080611;

color:white;

}




.sidebar{

position:fixed;

left:0;

top:0;

bottom:0;

width:240px;

background:#11101a;

padding:25px;

border-right:

1px solid rgba(255,255,255,.08);

}



.logo{

font-size:32px;

font-weight:900;

letter-spacing:2px;

}



.logo span{

color:#a855f7;

}



.sidebar p{

color:#888;

margin-top:5px;

}




.menu{

margin-top:30px;

}



.menu button{

width:100%;

padding:14px;

margin-bottom:10px;

border:0;

border-radius:12px;

background:#211d30;

color:white;

cursor:pointer;

text-align:left;

font-weight:bold;

transition:.25s;

}



.menu button:hover,
.menu button.active{

background:

linear-gradient(

135deg,

#7c3aed,

#ec4899

);

}




main{

margin-left:240px;

padding:30px;

}





.page{

display:none;

}



.page.active{

display:block;

}




.card{

background:

rgba(23,20,33,.95);

border:

1px solid rgba(255,255,255,.08);

padding:25px;

border-radius:22px;

margin-bottom:25px;

}





h1{

margin-top:0;

}





.stats{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:15px;

}





.stat{

background:#211d30;

padding:20px;

border-radius:16px;

}





.stat h2{

font-size:38px;

margin:0;

color:#c4b5fd;

}





.stat p{

color:#aaa;

}





input,
textarea{

width:100%;

padding:14px;

margin-top:12px;

background:#090812;

border:

1px solid #333;

border-radius:12px;

color:white;

outline:none;

}





textarea{

height:120px;

resize:none;

}





button.publish{

width:100%;

padding:15px;

margin-top:20px;

border:0;

border-radius:12px;

background:

linear-gradient(

135deg,

#7c3aed,

#ec4899

);

color:white;

font-weight:bold;

cursor:pointer;

}





.preview{

width:250px;

height:160px;

object-fit:cover;

border-radius:15px;

margin-top:15px;

display:none;

}

table{

width:100%;

border-collapse:collapse;

}



th,
td{

padding:12px;

border-bottom:

1px solid rgba(255,255,255,.12);

text-align:left;

}



th{

color:#c4b5fd;

}



.status{

margin-top:15px;

padding:12px;

border-radius:12px;

background:#13271a;

color:#86efac;

font-size:14px;

}





.settings-box{

padding:15px;

background:#211d30;

border-radius:15px;

margin-bottom:20px;

}



.settings-box p{

color:#aaa;

margin:8px 0;

}





@media(max-width:800px){


.sidebar{

position:relative;

width:100%;

height:auto;

}



main{

margin-left:0;

padding:15px;

}



.stats{

grid-template-columns:1fr;

}


}



</style>

</head>



<body>




<aside class="sidebar">


<div class="logo">

PYNI<span>.</span>

</div>



<p>
Admin Studio
</p>




<div class="menu">


<button
class="active"
onclick="openPage('dashboard',this)"
>

📊 Dashboard

</button>



<button
onclick="openPage('upload',this)"
>

➕ Upload Preset

</button>



<button
onclick="openPage('setting',this)"
>

⚙️ Setting Preset

</button>



</div>



</aside>






<main>





<section
id="dashboard"
class="page active"
>



<div class="card">


<h1>
Dashboard
</h1>




<div class="stats">



<div class="stat">


<h2 id="total">
0
</h2>


<p>
Total Preset
</p>


</div>




<div class="stat">


<h2>
ONLINE
</h2>


<p>
Worker Status
</p>


</div>




<div class="stat">


<h2>
1080P
</h2>


<p>
Quality
</p>


</div>




</div>


</div>



</section>

<section
id="upload"
class="page"
>


<div class="card">


<h1>
Upload Preset
</h1>



<input
id="name"
placeholder="Nama Preset"
>



<textarea
id="desc"
placeholder="Deskripsi preset..."
></textarea>



<input
id="link"
placeholder="Link Preset"
>



<input
id="image"
placeholder="nama.jpg"
>



<p style="
color:#888;
font-size:13px;
margin-top:10px;
">

Foto:
Pyni/assets/preset/nama.jpg

</p>



<img
id="preview"
class="preview"
>



<button
class="publish"
onclick="publishPreset()"
>

🚀 PUBLISH PRESET

</button>




<div
id="status"
class="status"
>

</div>



</div>


</section>








<section
id="setting"
class="page"
>


<div class="card">


<h1>
⚙️ Setting Preset
</h1>



<div
id="siteSetting"
class="settings-box"
>

Memuat setting...

</div>





<table>


<thead>


<tr>

<th>
Foto
</th>


<th>
Nama
</th>


<th>
Deskripsi
</th>


<th>
Link
</th>


<th>
Aksi
</th>


</tr>


</thead>





<tbody
id="table"
>


</tbody>




</table>




</div>


</section>






</main>







<script>


const WORKER_URL =

"https://pyni-preset-api.mandasukaaku.workers.dev/";



let presets=[];





function openPage(id,btn){


document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);



document
.getElementById(id)
.classList.add("active");



document
.querySelectorAll(".menu button")
.forEach(
b=>b.classList.remove("active")
);



btn.classList.add("active");

}

image.oninput=function(){


preview.src =

"../assets/preset/" + this.value;



preview.style.display="block";



preview.onerror=function(){

preview.style.display="none";

};


};







async function loadData(){


try{


let res = await fetch(WORKER_URL);



let data = await res.json();



if(data.presets){

presets = data.presets;

}


if(data.settings){


document.getElementById("siteSetting").innerHTML = `

<p>
<b>Nama Website:</b>
${data.settings.siteName}
</p>


<p>
<b>Deskripsi:</b>
${data.settings.siteDescription}
</p>


<p>
<b>URL:</b>
${data.settings.siteUrl}
</p>

`;

}



renderTable();


document.getElementById("total").innerHTML = presets.length;



}


catch(err){


document.getElementById("siteSetting").innerHTML =

"❌ Gagal mengambil data Worker";


console.log(err);


}



}









async function publishPreset(){


let data={


name:
name.value.trim(),


category:
"JJ",


description:
desc.value.trim(),


image:
"./assets/preset/" + image.value.trim(),


download:
link.value.trim(),


active:true


};





if(

!data.name ||

!data.download ||

!image.value

){


status.innerHTML =

"❌ Data belum lengkap";


return;


}





status.innerHTML =

"⏳ Mengirim ke Worker...";






try{



let res = await fetch(

WORKER_URL,

{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:

JSON.stringify(data)


}


);





let result = await res.json();





if(result.ok){


status.innerHTML =

"✅ Preset berhasil dipublish";



name.value="";

desc.value="";

link.value="";

image.value="";


preview.style.display="none";



loadData();



}

else{


status.innerHTML =

"❌ " + result.error;


}





}

catch(err){


status.innerHTML =

"❌ " + err.message;


}



}









function renderTable(){



let box =

document.getElementById("table");



box.innerHTML="";





if(presets.length===0){


box.innerHTML=

`

<tr>

<td colspan="5">

Belum ada preset

</td>

</tr>

`;

return;


}






presets.forEach((p,index)=>{



box.innerHTML +=

`

<tr>


<td>

<img src="../${p.image.replace("./","")}"

width="70"

height="50"

style="object-fit:cover;border-radius:8px">


</td>



<td>

${p.name}

</td>




<td>

${p.description}

</td>




<td>

<a href="${p.download}"

target="_blank">

Buka

</a>

</td>




<td>


<button

onclick="hapusPreset('${p.id}')"

style="

background:#ef4444;

color:white;

border:0;

padding:8px;

border-radius:8px;

cursor:pointer;

"

>

Hapus

</button>



</td>



</tr>

`;



});



}









async function hapusPreset(id){



if(!confirm("Hapus preset ini?"))

return;





await fetch(

WORKER_URL,

{


method:"DELETE",


headers:{


"Content-Type":

"application/json"


},


body:

JSON.stringify({

id:id

})


}

);





loadData();


}








loadData();





</script>


</body>

</html>
