<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PYNI Admin</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
margin:0;
background:#080611;
color:white;
}

.sidebar{
position:fixed;
width:230px;
top:0;
bottom:0;
background:#11101a;
padding:20px;
}

.logo{
font-size:30px;
font-weight:900;
}

.logo span{
color:#a855f7;
}

.menu button{
width:100%;
padding:14px;
margin:8px 0;
border:0;
border-radius:12px;
background:#211d30;
color:white;
cursor:pointer;
text-align:left;
}

.menu button.active,
.menu button:hover{
background:linear-gradient(135deg,#7c3aed,#ec4899);
}


main{
margin-left:230px;
padding:25px;
}


.page{
display:none;
}

.page.active{
display:block;
}


.card{
background:#171421;
padding:25px;
border-radius:20px;
margin-bottom:20px;
}


input,
textarea{
width:100%;
padding:14px;
margin-top:12px;
background:#090812;
color:white;
border:1px solid #333;
border-radius:12px;
}


textarea{
height:120px;
}


button.publish{
width:100%;
margin-top:20px;
padding:15px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#7c3aed,#ec4899);
color:white;
font-weight:bold;
cursor:pointer;
}


.preview{
display:none;
width:250px;
height:160px;
object-fit:cover;
border-radius:15px;
margin-top:15px;
}


table{
width:100%;
border-collapse:collapse;
}


td,th{
padding:12px;
border-bottom:1px solid #333;
}


.status{
margin-top:15px;
padding:12px;
border-radius:10px;
background:#13271a;
color:#86efac;
}

</style>

</head>


<body>


<aside class="sidebar">

<div class="logo">
PYNI<span>.</span>
</div>

<p>Admin Studio</p>


<div class="menu">

<button class="active" onclick="openPage('dashboard',this)">
📊 Dashboard
</button>


<button onclick="openPage('upload',this)">
➕ Upload Preset
</button>


<button onclick="openPage('setting',this)">
⚙️ Setting Preset
</button>


</div>

</aside>



<main>


<section id="dashboard" class="page active">

<div class="card">

<h1>Dashboard</h1>

<h2 id="total">
0
</h2>

<p>Total Preset</p>

</div>

</section>




<section id="upload" class="page">

<div class="card">

<h1>Upload Preset</h1>


<input id="name" placeholder="Nama Preset">


<textarea id="desc" placeholder="Deskripsi"></textarea>


<input id="link" placeholder="Link Preset">


<input id="image" placeholder="nama.jpg">


<p>
Foto:
assets/preset/nama.jpg
</p>


<img id="preview" class="preview">


<button class="publish" onclick="publishPreset()">
🚀 PUBLISH PRESET
</button>


<div id="status" class="status">
</div>


</div>

</section>




<section id="setting" class="page">

<div class="card">

<h1>Setting Preset</h1>


<table>

<thead>
<tr>
<th>Foto</th>
<th>Nama</th>
<th>Deskripsi</th>
<th>Link</th>
</tr>
</thead>


<tbody id="table">

</tbody>


</table>


</div>

</section>


</main>




<script>

const WORKER_URL =
"https://pyni-preset-api.mandasukaaku.workers.dev/";


const nameInput =
document.getElementById("name");

const descInput =
document.getElementById("desc");

const linkInput =
document.getElementById("link");

const imageInput =
document.getElementById("image");

const preview =
document.getElementById("preview");

const statusBox =
document.getElementById("status");

const table =
document.getElementById("table");

const total =
document.getElementById("total");



function openPage(id,btn){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));


document.getElementById(id)
.classList.add("active");


document.querySelectorAll(".menu button")
.forEach(x=>x.classList.remove("active"));


btn.classList.add("active");

}




imageInput.oninput=function(){

preview.src =
"../assets/preset/" +
this.value;


preview.style.display="block";


preview.onerror=function(){

preview.style.display="none";

};

}




async function publishPreset(){


const data={

name:nameInput.value.trim(),

description:descInput.value.trim(),

link:linkInput.value.trim(),

image:imageInput.value.trim()

};



if(!data.name || !data.link || !data.image){

showStatus(
"❌ Data belum lengkap"
);

return;

}



showStatus(
"⏳ Mengirim..."
);



try{


const res =
await fetch(
WORKER_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify(data)

});


const json =
await res.json();



if(json.ok){

showStatus(
"✅ Berhasil publish"
);


nameInput.value="";
descInput.value="";
linkInput.value="";
imageInput.value="";


preview.style.display="none";


loadPreset();


}else{


showStatus(
"❌ "+(json.error||"Gagal")
);


}


}catch(e){

showStatus(
"❌ "+e.message
);

}


}




async function loadPreset(){

try{


const res =
await fetch(
WORKER_URL
);


const json =
await res.json();



if(
json.packs &&
Array.isArray(json.packs)
){

total.innerText =
json.packs.length;


table.innerHTML="";


json.packs.forEach(p=>{


table.innerHTML +=`

<tr>

<td>
<img width="70" src="../assets/preset/${p.image}">
</td>

<td>${p.name}</td>

<td>${p.description||"-"}</td>

<td>${p.link||"-"}</td>

</tr>

`;


});


}


}catch(e){}

}




function showStatus(text){

statusBox.style.display="block";

statusBox.innerHTML=text;


setTimeout(()=>{

statusBox.style.display="none";

},4000);

}


loadPreset();


</script>


</body>
</html>
