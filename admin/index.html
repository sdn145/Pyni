<script>

const WORKER_URL =
"https://pyni-preset-api.mandasukaaku.workers.dev/";


const imageInput =
document.getElementById("image");


const preview =
document.getElementById("preview");



imageInput.addEventListener(
"input",
()=>{

const file =
imageInput.value.trim();


if(!file){

preview.style.display="none";
return;

}


preview.src =
"../assets/preset/" + file;


preview.style.display="block";


preview.onerror=()=>{

preview.style.display="none";

};


}

);



async function publishPreset(){


const name =
document.getElementById("name")
.value.trim();


const desc =
document.getElementById("desc")
.value.trim();


const link =
document.getElementById("link")
.value.trim();


const image =
document.getElementById("image")
.value.trim();



if(!name || !link || !image){

showStatus(
"❌ Nama, Link, dan Foto wajib diisi"
);

return;

}



showStatus(
"⏳ Mengirim preset ke server..."
);



try{


const response =
await fetch(
WORKER_URL,
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

name:name,

description:desc,

link:link,

image:image

})


}

);



const result =
await response.json();



if(!result.ok){

throw new Error(
result.error ||
"Publish gagal"
);

}



showStatus(
"✅ Preset berhasil dipublish ke Pyni!"
);



document.getElementById("name")
.value="";


document.getElementById("desc")
.value="";


document.getElementById("link")
.value="";


document.getElementById("image")
.value="";


preview.style.display="none";



loadPreset();



}
catch(error){


showStatus(
"❌ Error:\n" +
error.message
);


}


}




async function loadPreset(){


const box =
document.getElementById(
"presetList"
);


box.innerHTML =
"<p style='color:#94a3b8'>Memuat preset...</p>";



try{


const response =
await fetch(
WORKER_URL
);



const data =
await response.json();



if(!data.ok){

throw new Error(
"Data tidak tersedia"
);

}



box.innerHTML =
"<p style='color:#94a3b8'>Preset tersimpan di GitHub</p>";



}
catch(error){


box.innerHTML =
"<p style='color:#ff9da8'>Gagal memuat data</p>";


}


}





function showStatus(text){


const box =
document.getElementById(
"status"
);


box.style.display =
"block";


box.innerHTML =
text;



setTimeout(()=>{

box.style.display =
"none";

},4000);


}



loadPreset();


</script>
